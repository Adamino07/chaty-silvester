<style>

/* Layout: zasnežená horská nástenka – úzka hlavička s odpočtom, lepkavý pás filtrov, mriežka kariet s fotkou chaty. */
:root {

  --ember: #a8600c; --ember-soft: #f6e6cf; --frost: #2f5a8c; --frost-soft: #dde8f5; --heart: #c2364b;
  --shadow: 0 1px 2px rgba(21, 32, 27, .06), 0 6px 18px -10px rgba(21, 32, 27, .25);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311; --surface: #151d19; --surface-2: #1d2722; --ink: #e3ebe6; --muted: #93a69b; --line: #29352f;
    --spruce: #72c49f; --spruce-ink: #0d1311; --spruce-soft: #17302a;
    --ember: #e6a955; --ember-soft: #34250f; --frost: #8fb5e6; --frost-soft: #182438; --heart: #f07b8d;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #151d19; --surface-2: #1d2722; --ink: #e3ebe6; --muted: #93a69b; --line: #29352f;
  --spruce: #72c49f; --spruce-ink: #0d1311; --spruce-soft: #17302a;
  --ember: #e6a955; --ember-soft: #34250f; --frost: #8fb5e6; --frost-soft: #182438; --heart: #f07b8d;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--spruce); }
:focus-visible { outline: 2px solid var(--spruce); outline-offset: 2px; }
header { padding-block: 28px 14px; }
.back { font-size: 14px; font-weight: 600; text-decoration: none; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 5vw, 42px); line-height: 1.05; letter-spacing: -.02em; margin: 10px 0 8px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; max-width: 65ch; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.sum { display: flex; align-items: baseline; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.sum b { font-family: var(--f-display); font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.people { font-size: 13.5px; color: var(--muted); margin-top: 12px; }
main { padding-block: 10px 48px; display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: 44px 150px 1fr; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.row.lead-row { border-color: var(--spruce); }
.rank { font-family: var(--f-display); font-weight: 800; font-size: 26px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; line-height: 1.2; }
.lead-row .rank { color: var(--spruce); }
.ph { display: block; aspect-ratio: 8 / 5; max-width: 100%; border-radius: 10px; background-color: var(--surface-2); background-repeat: no-repeat; }
.info { min-width: 0; display: grid; gap: 6px; }
.name { font-family: var(--f-display); font-weight: 600; font-size: 19px; line-height: 1.2; margin: 0; }
.name a { color: var(--ink); text-decoration: none; }
.name a:hover { text-decoration: underline; }
.meta { font-size: 13px; color: var(--muted); }
.gone { font-size: 12px; font-weight: 600; color: var(--ember); background: var(--ember-soft); border-radius: 999px; padding: 2px 8px; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.bar i { display: block; height: 100%; }
.bar .up { background: var(--spruce); }
.bar .down { background: var(--ember); }
.tally { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; }
.tally b { font-variant-numeric: tabular-nums; }
.za b { color: var(--spruce); } .proti b { color: var(--ember); }
.cm { margin: 2px 0 0; padding-left: 10px; border-left: 3px solid var(--line); font-size: 13px; overflow-wrap: anywhere; }
.cm b { font-weight: 600; }
.inq { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; margin-top: 2px; }
.inq button { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 6px 12px; border: 1px solid var(--spruce); background: var(--surface); color: var(--spruce); }
.inq .st { font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--ink); }
.inq .st.ok { background: var(--spruce-soft); color: var(--spruce); }
.inq .st.no { background: var(--ember-soft); color: var(--ember); }
.inq .muted { color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 20; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
footer { color: var(--muted); font-size: 12.5px; padding-block: 0 40px; }
@media (max-width: 600px) {
  .row { grid-template-columns: 36px 1fr; }
  .ph { grid-column: 2; }
  .info { grid-column: 1 / -1; }
}
</style>

const [GC, GR] = DATA.grid, BY_ID = Object.fromEntries(DATA.records.map(r => [r.id, r]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function sb(path, body) {
  const r = await fetch(DATA.vote.url + "/rest/v1/" + path, { method: body ? "POST" : "GET", body: body ? JSON.stringify(body) : undefined,
    headers: { apikey: DATA.vote.key, Authorization: "Bearer " + DATA.vote.key, "Content-Type": "application/json" } });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || String(r.status)); }
  return r.status === 204 ? null : r.json().catch(() => null);
}

// Dopyty: kamarát chatu navrhne, Adam dopyt schváli a odošle; stav vidia všetci.
const INQ = { navrh: ["Navrhnuté na dopyt, čaká na Adamovo schválenie", ""], odoslane: ["Dopyt odoslaný, čaká sa na odpoveď", ""],
  volne: ["Majiteľ potvrdil: voľné", "ok"], obsadene: ["Majiteľ odpovedal: obsadené", "no"], zamietnute: ["Dopyt sa neposiela", "no"] };
const fmtDay = iso => { const t = new Date(iso); return t.getDate() + ". " + (t.getMonth() + 1) + "."; };
function inqHtml(id, q) {
  if (!q) return `<div class="inq"><button data-inq="${esc(id)}">Popýtať termín u majiteľa</button><span class="muted">Dopyt pošle Adam po schválení.</span></div>`;
  const [label, cls] = INQ[q.status] || [q.status, ""];
  return `<div class="inq"><span class="st ${cls}">${esc(label)}</span><span class="muted">navrhol/a ${esc(q.requested_by)} ${fmtDay(q.requested_at)}${q.status !== "navrh" ? " · stav z " + fmtDay(q.updated_at) : ""}</span>${q.note ? `<span>${esc(q.note)}</span>` : ""}</div>`;
}
let rowsById = {};
document.addEventListener("click", async e => {
  const id = e.target.dataset.inq; if (!id) return;
  let me = null, code = "";
  try { me = JSON.parse(localStorage.getItem("voter") || "null"); code = localStorage.getItem("vcode") || ""; } catch (x) {}
  if (!me || !code) return toast("Najprv si na hlavnej stránke vyberte profil");

  catch (err) { e.target.disabled = false; toast(String(err.message).includes("no_profile") ? "Najprv si na hlavnej stránke vyberte profil" : "Návrh sa nepodarilo uložiť"); }
});

  if (!r || !r.img) return `class="ph"`;

}
async function load() {
  let vs, cs, ps, qs = [], cu = [];

    [vs, cs, ps] = await Promise.all([sb("votes?select=chata_id,voter,value,chata_name,chata_url"),

  } catch (e) {

    (v.value > 0 ? x.up : x.down).push(v.voter); });
  cs.forEach(c => { if (by[c.chata_id]) by[c.chata_id].cm.push(c); });

  rowsById = {};

    rowsById[x.id] = { name, url };
    const cx = CU[x.id];
    const cmeta = cx ? [cx.place, cx.price ? eur(cx.price / (rates[cx.currency] || 1) / 10) + " / os. pri 10 os." : "cena neuvedená",
      (cx.bedrooms || "?") + " spální, " + (cx.beds || "?") + " lôžok", "pridal/a " + cx.added_by + ", termín treba overiť"].filter(Boolean).join(" · ") : "";
    const meta = r ? [[r.l, COUNTRY[r.c]].filter(Boolean).join(", "), r.pp != null ? eur(r.pp) + (r.est ? "*" : "") + " / os. pri 10 os." : "cena na dopyt",
      r.h != null ? r.h.toFixed(1).replace(".", ",") + " h z Brna" : "", (r.br || "?") + " spální, " + (r.bd || "?") + " lôžok",
      r.av === "volne" ? "voľná podľa kalendára" : "termín treba overiť"].filter(Boolean).join(" · ") : "";
    return `<article class="row ${x.up.length === top && top > 0 ? "lead-row" : ""}">
      <div class="rank">${rank}.</div>
      ${url ? `<a ${photo(r)} href="${esc(url)}" target="_blank" rel="noopener" aria-label="${esc(name)}"></a>` : `<span ${photo(r)}></span>`}
      <div class="info">
        <h2 class="name">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)} ↗</a>` : esc(name)}</h2>
        <div class="meta">${esc(cx ? cmeta : meta)} ${r || cx ? "" : `<span class="gone">už nie je v zozname</span>`}</div>
        <div class="bar" aria-hidden="true"><i class="up" style="width:${x.up.length / max * 100}%"></i><i class="down" style="width:${x.down.length / max * 100}%"></i></div>
        <div class="tally"><span class="za"><b>${x.up.length} za</b>${x.up.length ? ": " + esc(x.up.join(", ")) : ""}</span>
          <span class="proti"><b>${x.down.length} proti</b>${x.down.length ? ": " + esc(x.down.join(", ")) : ""}</span></div>
        ${inqHtml(x.id, inq[x.id])}
        ${x.cm.map(c => `<p class="cm"><b>${esc(c.voter)}:</b> ${esc(c.body)}</p>`).join("")}
      </div></article>`;
  }).join("") || `<div class="empty">Zatiaľ nikto nehlasoval. Hlasuje sa na <a href="./">hlavnej stránke</a> tlačidlami Som za / Nie pri každej chate.</div>`;
  $("#foot").textContent = "Obnovené " + new Date().toLocaleTimeString("sk-SK") + " · stránka sa obnovuje sama každých 30 sekúnd. Hviezdička pri cene = odhad.";
}
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>
