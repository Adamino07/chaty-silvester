// Obľúbené: vlastný dokument favs/<id> v databáze stránky (prežije nové verzie stránky aj iné zariadenie),

const BY_ID = Object.fromEntries(R.map(r => [r.id, r]));
const favMeta = {};   // id -> {id, n, u, l}
let favs = new Set(), favDoc = null, othersFav = {}, favSaving = Promise.resolve();
const metaOf = id => { const r = BY_ID[id]; return r ? { id, n: r.n, u: r.u, l: r.l || "" } : favMeta[id] || { id, n: id, u: "", l: "" }; };
try {
  const raw = JSON.parse(localStorage.getItem("favs") || "[]");
  raw.forEach(x => { const m = typeof x === "string" ? metaOf(x) : x; favs.add(m.id); favMeta[m.id] = m; });
} catch (e) {}
function saveFavs() {
  const items = [...favs].map(metaOf);
  items.forEach(m => favMeta[m.id] = m);
  try { localStorage.setItem("favs", JSON.stringify(items)); } catch (e) {}
  if (favDoc) {
    // jeden zápis naraz do toho istého dokumentu
    favSaving = favSaving.then(() => favDoc.set({ items, updated: new Date().toISOString() }))
      .catch(e => { if (e && e.code === "invalid_argument") { favDoc = null; toast("Obľúbené sa uložia len v tomto prehliadači"); } });

}
(async () => {
  if (!window.claude || !window.claude.use) return;   // otvorené mimo Claude: len localStorage
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) return;
  favDoc = db.doc("favs/" + uid);
  let first = true;
  favDoc.onSnapshot(snap => {
    const remote = (snap.exists && snap.data().items) || [];
    remote.forEach(m => favMeta[m.id] = m);
    if (first) {   // prvé načítanie: zlúčiť s tým, čo bolo v prehliadači
      first = false;
      const before = favs.size;
      remote.forEach(m => favs.add(m.id));
      if (favs.size !== remote.length) saveFavs();
      if (favs.size !== before) { renderViews(); apply(); }
    }
  }, () => {});
  db.collection("favs").onSnapshot(snap => {
    othersFav = {};
    snap.docs.forEach(d => { if (d.id !== uid) ((d.data() || {}).items || []).forEach(m => othersFav[m.id] = (othersFav[m.id] || 0) + 1); });

})();

async function sb(path, body) {

    headers: { apikey: V.key, Authorization: "Bearer " + V.key, "Content-Type": "application/json" } });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || String(r.status)); }
  return r.status === 204 ? null : r.json().catch(() => null);
}
let voteReady = false;
async function loadVotes() {
  try {
    const [vs, cs] = await Promise.all([sb("votes?select=chata_id,voter,value,chata_name,chata_url"),
                                        sb("comments?select=chata_id,voter,body,created_at&order=created_at"),
                                        sb("voters?select=name&order=name").then(x => { profiles = x.map(p => p.name); })]);
    for (const k in votes) delete votes[k];
    for (const k in comments) delete comments[k];
    vs.forEach(v => { (votes[v.chata_id] = votes[v.chata_id] || {})[v.voter] = v.value; voteMeta[v.chata_id] = { n: v.chata_name, u: v.chata_url }; });
    cs.forEach(c => (comments[c.chata_id] = comments[c.chata_id] || []).push(c));
    voteReady = true; refreshVotes();
    if (st.view === "vote" && !document.querySelector(".cmts[open]") && document.activeElement.tagName !== "INPUT") apply();
  } catch (e) { voteReady = false; renderVotebar(); }

function renderVotebar() {
  const bar = $("#votebar"); bar.hidden = false;
  if (!voteReady) { bar.innerHTML = `<span class="muted">Hlasovanie sa teraz nedá načítať. Skúste stránku obnoviť neskôr.</span>`; return; }
  // neprepisovať rozpísaný formulár; inak ho obnoviť, aby v zozname pribudli nové profily
  if (!me && bar.querySelector("form") && (bar.contains(document.activeElement) || $("#vWho").value || $("#vCode").value)) return;
  const people = new Set(); Object.values(votes).forEach(v => Object.keys(v).forEach(n => people.add(n)));
  const stat = `<span class="muted">Hlasovalo ${people.size} ľudí${people.size ? ": " + esc([...people].join(", ")) : ""}.</span>`;
  bar.innerHTML = me ? `<span>Hlasujete ako <b>${esc(me.name)}</b></span><button class="ghost" id="voteLogout">Zmeniť meno</button>${stat}`
    : `<form id="voteLogin"><b>Zapojte sa do hlasovania:</b>
       <select id="vWho" aria-label="Váš profil"><option value="">Kto ste?</option>${profiles.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("")}<option value="__new">+ Nový profil</option></select>
       <input id="vName" maxlength="40" placeholder="Meno nového profilu" aria-label="Meno nového profilu" hidden>
       <input id="vCode" placeholder="Kód skupiny" aria-label="Kód skupiny" required><button class="btn" type="submit">Pokračovať</button></form>${stat}`;
}
function needLogin() { toast("Najprv si vyberte profil a zadajte kód skupiny"); $("#votebar").scrollIntoView({ behavior: "smooth", block: "center" }); const n = $("#vWho"); if (n) n.focus(); }
document.addEventListener("change", e => { if (e.target.id === "vWho") { const n = $("#vName"); n.hidden = e.target.value !== "__new"; if (!n.hidden) n.focus(); } });
document.addEventListener("submit", async e => {
  if (e.target.id === "voteLogin") {
    e.preventDefault();
    const who = $("#vWho").value, isNew = who === "__new", code = $("#vCode").value.trim();
    const name = isNew ? $("#vName").value.trim() : who;
    if (!name) return toast(isNew ? "Zadajte meno nového profilu" : "Vyberte svoj profil alebo založte nový");
    try {
      const saved = await sb("rpc/join_group", { p_code: code, p_voter: name, p_new: isNew });
      me = { name: saved, code }; try { localStorage.setItem("voter", JSON.stringify(me)); } catch (x) {}
      $("#votebar").innerHTML = ""; refreshVotes(); toast("Môžete hlasovať");
    } catch (x) {
      const m = String(x.message);
      toast(m.includes("bad_code") ? "Kód skupiny nesedí" : m.includes("name_taken") ? "Profil s týmto menom už existuje – vyberte ho zo zoznamu"
        : m.includes("no_profile") ? "Tento profil už neexistuje, založte nový" : "Prihlásenie zlyhalo, skúste to znova");
      if (m.includes("name_taken")) loadVotes();
    }
    return;
  }
  const cid = e.target.dataset.cform;
  if (cid) {
    e.preventDefault();
    if (!me) return needLogin();
    const input = e.target.querySelector("input"), body = input.value.trim();
    if (!body) return;
    try { await sb("rpc/add_comment", { p_code: me.code, p_chata: cid, p_voter: me.name, p_body: body }); input.value = ""; await loadVotes(); toast("Komentár pridaný"); }
    catch (x) { toast("Komentár sa nepodarilo uložiť"); }
  }
});
document.addEventListener("click", async e => {
  if (e.target.id === "voteLogout") { me = null; try { localStorage.removeItem("voter"); } catch (x) {} refreshVotes(); return; }
  const b = e.target.closest("[data-vote]");
  if (!b) return;
  if (!me) return needLogin();
  const id = b.closest(".vote").dataset.vid, r = BY_ID[id] || {}, want = +b.dataset.vote;
  const cur = (votes[id] || {})[me.name] || 0, val = cur === want ? 0 : want;   // druhý klik hlas zruší
  votes[id] = votes[id] || {};
  if (val) votes[id][me.name] = val; else { delete votes[id][me.name]; if (!Object.keys(votes[id]).length) delete votes[id]; }
  refreshVotes();
  try { await sb("rpc/cast_vote", { p_code: me.code, p_chata: id, p_voter: me.name, p_value: val, p_name: r.n || "", p_url: r.u || "" }); }
  catch (x) { toast("Hlas sa nepodarilo uložiť"); loadVotes(); }
});

renderViews();
apply();
if (DATA.vote) { loadVotes(); setInterval(() => { if (!document.hidden) loadVotes(); }, 30000); }
</script>
</body></html>
